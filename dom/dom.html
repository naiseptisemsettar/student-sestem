<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة الطلاب - Student Management System</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 15px; background: #f9f9f9; }
      .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
      input, button { padding: 8px 12px; margin: 5px 2px; border: 1px solid #ccc; border-radius: 4px; }
      button { cursor: pointer; background: #007bff; color: white; border: none; }
      button:hover { opacity: 0.9; }
      .btn-danger { background: #dc3545; }
      .btn-warning { background: #ffc107; color: black; }
      .btn-success { background: #28a745; }
      .btn-secondary { background: #6c757d; }
      table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
      th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
      th { background: #007bff; color: white; }
      .no-results { text-align: center; color: #dc3545; font-weight: bold; padding: 15px; display: none; }
    </style>
  </head>
  <body>
    <h2>نظام إدارة الطلاب (Student Management System)</h2>

    <!-- المطلب 2 و 3: إضافة وتعديل طالب -->
    <div class="box">
      <h4 id="form-title">إضافة طالب جديد</h4>
      <form id="student-form">
        <input type="hidden" id="student-id" />
        <input type="text" id="name" placeholder="اسم الطالب" required />
        <input type="email" id="email" placeholder="البريد الإلكتروني" required />
        <input type="number" id="grade" placeholder="العلامة (0-100)" min="0" max="100" required />
        <button type="submit" id="submit-btn">إضافة طالب</button>
        <button type="button" id="cancel-btn" class="btn-secondary" style="display: none;" onclick="resetForm()">إلغاء</button>
      </form>
    </div>

    <!-- المطلب 5 و 6 و 7 و 8: البحث، العداد، الترتيب، والفلترة -->
    <div class="box">
      <input type="text" id="search-input" placeholder="ابحث عن طالب بالاسم..." onkeyup="filterAndDisplay()" />
      <button type="button" onclick="sortByGrade()">ترتيب حسب العلامة (الأعلى أولاً)</button>
      <button type="button" class="btn-success" onclick="togglePassedOnly()" id="passed-btn">عرض الناجحين فقط (50+)</button>
      <button type="button" class="btn-secondary" onclick="resetFilters()">عرض الكل</button>
      
      <!-- المطلب 6: عداد الطلاب -->
      <p><strong>عدد الطلاب المعروضين: <span id="student-count">0</span></strong></p>
    </div>

    <!-- المطلب 1: جدول عرض الطلاب -->
    <table>
      <thead>
        <tr>
          <th>الاسم</th>
          <th>البريد الإلكتروني</th>
          <th>العلامة</th>
          <th>الحالة</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody id="students-table-body"></tbody>
    </table>

    <!-- المطلب 8: رسالة عدم وجود نتائج -->
    <p id="no-results-msg" class="no-results">لا يوجد طلاب مطابقون للبحث أو الفلترة!</p>

    <script src="script.js"></script>
  </body>
</html>
